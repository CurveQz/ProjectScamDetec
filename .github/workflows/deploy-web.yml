# Deploy หน้าเว็บ (โฟลเดอร์ web/) ขึ้น Vercel อัตโนมัติ เมื่อมีคน push เข้า main
# ใช้ token ของบัญชี Vercel เจ้าของโปรเจค -> commit ของเพื่อนในทีมก็ deploy ได้ (แผน Hobby)
#
# ต้องมี secret ใน GitHub: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# (Settings -> Secrets and variables -> Actions)

name: Deploy web (Vercel)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: # กดรันเองได้จากแท็บ Actions

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # ลบข้อมูล git ออกก่อน deploy: Vercel แผน Hobby อาจบล็อก deploy ถ้าคน commit ไม่ใช่เจ้าของบัญชี
      - name: Remove git metadata
        run: rm -rf .git

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # ดึงค่าตั้งค่าโปรเจค (Root Directory = web, VITE_API_URL ฯลฯ) จาก Vercel
      - name: Pull Vercel settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
