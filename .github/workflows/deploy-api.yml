# สั่ง Render deploy API ใหม่อัตโนมัติ เมื่อมีคน push โค้ด API หรือโมเดลเข้า main
#
# ต้องมี secret ใน GitHub: RENDER_DEPLOY_HOOK
# (Render -> ProjectScamDetec -> Settings -> Deploy Hook)

name: Deploy API (Render)

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "sms_model.joblib"
      - "sms_pipeline.py"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: # กดรันเองได้จากแท็บ Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
