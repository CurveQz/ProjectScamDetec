button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #fa792d;outline-offset:3px}
svg{width:20px;height:20px;flex:none}p{line-height:1.8;margin-top:0}h1,h2{margin-top:0;letter-spacing:-.04em;line-height:1.25}
.wrap{max-width:1240px;padding-inline:56px;margin:auto;width:100%}
/* nav (same as landing) */
.site-nav{position:sticky;top:0;z-index:40;background:var(--bg-nav);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-inner{height:80px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:inline-flex;gap:10px;align-items:center;font-size:19px;font-weight:700;letter-spacing:-.04em}
.brand-mark{width:29px;height:30px;display:grid;place-items:center;font-size:20px;line-height:1;color:#14200e;background:var(--accent);border-radius:5px;font-family:Arial;font-weight:900;transform:skewY(-6deg)}
.nav-right{display:flex;align-items:center;gap:22px}
.home-link{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}.home-link:hover{color:var(--fg)}.home-link svg{width:15px;height:15px}
.toggles{display:flex;gap:10px;align-items:center;padding-left:20px;border-left:1px solid var(--line)}
.switch{position:relative;width:64px;height:34px;border-radius:999px;border:1px solid var(--line2);background:var(--sw-bg);padding:0 10px;display:flex;align-items:center;justify-content:space-between;color:var(--muted)}
.switch .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--accent);transition:transform .3s cubic-bezier(.4,1.5,.6,1)}
.switch[aria-checked=true] .knob{transform:translateX(30px)}
.switch .sw{position:relative;z-index:1;display:grid;place-items:center;width:14px;font-size:10px;font-weight:700}.switch .sw svg{width:14px;height:14px}
.switch[aria-checked=false] .sw:first-of-type,.switch[aria-checked=true] .sw:nth-of-type(2){color:#14200e}
/* tabs */
main{flex:1;padding:44px 0 70px}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;width:min(460px,100%);margin:0 auto 38px;padding:5px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.tabs button{position:relative;z-index:1;border:0;background:none;padding:12px 10px;border-radius:999px;font-size:14px;font-weight:700;color:var(--muted);transition:color .3s;white-space:nowrap}
.tabs button[aria-selected=true]{color:#14200e}
.tab-ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:999px;background:var(--accent);transition:transform .45s cubic-bezier(.5,1.3,.4,1)}
.tabs[data-active="1"] .tab-ind{transform:translateX(100%)}
.viewport{overflow:hidden}
.track{display:flex;transition:transform .55s cubic-bezier(.65,0,.25,1)}
.track[data-active="1"]{transform:translateX(-100%)}
.panel{flex:0 0 100%;min-width:0;padding:4px 2px 30px}
.panel-inner{max-width:860px;margin:auto}
.panel h1{font-size:clamp(30px,3.6vw,44px);margin-bottom:10px}
.panel .lead{color:var(--muted);font-size:15px;margin-bottom:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
/* chat */
.chat{display:flex;flex-direction:column;height:min(600px,calc(100vh - 380px));min-height:420px;overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:82%;animation:msgIn .4s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes msgIn{from{opacity:0;transform:translateY(12px) scale(.97)}}
.msg .who{width:30px;height:30px;flex:none}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:13px 17px;border-radius:18px 18px 18px 5px;background:var(--card2);font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:var(--accent);color:#14200e;border-radius:18px 18px 5px 18px}
.bubble .tag{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;opacity:.6;margin-bottom:3px}
.result{display:flex;flex-direction:column;gap:10px;white-space:normal;min-width:240px}
.verdict{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid}
.verdict.good{background:var(--good-bg);border-color:var(--good-b);color:var(--good)}.verdict.bad{background:var(--bad-bg);border-color:var(--bad-b);color:var(--bad)}.verdict.info{border-color:var(--line2);color:var(--muted)}
.verdict svg{width:15px;height:15px}
.result dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}.result dt{color:var(--muted2)}.result dd{margin:0;font-weight:700}
.result .note{font-size:12px;color:var(--muted);margin:0;line-height:1.7}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:dot 1.2s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.examples{display:flex;align-items:center;gap:8px;padding:12px 20px 0;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
.examples::-webkit-scrollbar{display:none}
.examples span{font-size:12px;color:var(--muted2);white-space:nowrap}
.examples button{flex:none;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--fg)}
.examples button:hover{border-color:var(--good-b);background:var(--good-bg)}
.composer{position:relative;margin:12px 16px 16px;border:1px solid var(--line2);border-radius:16px;background:var(--field);transition:border-color .2s}
.composer:focus-within{border-color:var(--good-b)}
.composer textarea{display:block;width:100%;border:0;background:transparent;resize:none;padding:15px 150px 15px 18px;font-size:14px;line-height:1.7;min-height:56px;max-height:200px;outline:none}
.composer textarea::placeholder{color:var(--muted2)}
.send{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:11px;padding:10px 16px;font-weight:700;font-size:13px;background:var(--accent);color:#14200e;transition:transform .15s,opacity .2s}
.send:hover:not(:disabled){transform:translateY(-1px)}.send:active:not(:disabled){transform:translateY(1px) scale(.97)}
.send:disabled{opacity:.45;cursor:default}.send svg{width:16px;height:16px}
.hint{font-size:11px;color:var(--muted2);margin:-6px 18px 14px}
/* submit form */
.form{padding:26px}
.field{margin-bottom:20px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
.form .composer{margin:0}.form .composer textarea{padding-right:18px;min-height:130px;max-height:260px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.select{position:relative}
.select select{appearance:none;-webkit-appearance:none;width:100%;padding:13px 40px 13px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--field);font-size:14px;cursor:pointer}
.select select:disabled{opacity:.5;cursor:default}
.select:after{content:'';position:absolute;right:17px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
select option{background:var(--card);color:var(--fg)}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:6px}
.form-foot p{font-size:12px;color:var(--muted2);margin:0;max-width:460px;line-height:1.7}
.form .send{position:static;padding:13px 22px;font-size:14px;border-radius:12px}
.toast{margin-top:18px;padding:14px 18px;border-radius:14px;font-size:13px;display:flex;gap:10px;align-items:center;animation:msgIn .4s both}
.toast.ok{background:var(--good-bg);border:1px solid var(--good-b);color:var(--good)}.toast.err{background:var(--bad-bg);border:1px solid var(--bad-b);color:var(--bad)}
.spin{width:15px;height:15px;border:2px solid #14200e55;border-top-color:#14200e;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* footer */
.footer{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;font-size:12px;padding-block:28px;color:var(--muted);border-top:1px solid var(--line)}
.footer p{margin:0}.footer .brand{font-size:16px;color:var(--fg)}
.cq-mark{width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid #e3e3e3;display:grid;place-items:center}.cq-mark svg{width:26px;height:26px}
@media(max-width:760px){.wrap{padding-inline:18px}.nav-inner{height:68px}.home-link span{display:none}.toggles{border:0;padding:0;gap:8px}.nav-right{gap:12px}
main{padding:26px 0 50px}.tabs{margin-bottom:26px}.tabs button{font-size:13px;padding:11px 6px}
.messages{padding:16px}.msg{max-width:92%}.composer textarea{padding-right:18px;padding-bottom:58px}.row{grid-template-columns:1fr}.form{padding:18px}.form-foot{flex-direction:column;align-items:stretch}.form .send{justify-content:center}
.chat{height:calc(100vh - 250px);min-height:460px}.brand{font-size:17px}.switch{width:56px;padding:0 8px}.switch[aria-checked=true] .knob{transform:translateX(22px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

'res.demoT':'Demo mode','res.demo':'This page isn’t connected to the API yet, so it can only analyse the example messages. Try one of the examples below.','res.err':'Couldn’t reach the system. Please try again.',
'sub.h1':'Submit a message','sub.lead':'Send us an SMS you received and tell us what type it is. The team reviews every submission before using it to improve the model.',
'sub.label':'SMS message','sub.ph':'Paste the SMS here','sub.group':'Message type','sub.sub':'Subcategory','sub.choose':'-- Select --',
'sub.note':'Please hide OTPs, account numbers and personal details before sending. Submissions are screened before use.','sub.btn':'Send',
'sub.ok':'Thank you — we’ve received your message. The team will review it before use.','sub.demo':'Demo mode: the API isn’t connected yet, so nothing was sent or saved.','sub.err':'Couldn’t send. Please try again.',
'foot.p':'Thai SMS classification project','title':'ScamDetec — Check a message'}};

const icon={ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
bad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3L2 21h20zM12 10v4M12 17.5v.5"/></svg>',
info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>'};
const botAvatar='<span class="brand-mark who" aria-hidden="true" style="width:30px;height:30px;font-size:17px">s</span>';

const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const root=document.documentElement;let lang=store.get('sd-lang')==='en'?'en':'th';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=k=>T[lang][k];
const groupLabel=v=>{const g=GROUPS.find(g=>g.value===v);return g?g[lang]:v};
const subLabel=v=>{for(const g of GROUPS){const s=g.subs.find(s=>s.value===v);if(s)return s[lang];}return v};

/* ---------- theme / language ---------- */
function setTheme(th){root.dataset.theme=th;$('#themeSwitch').setAttribute('aria-checked',String(th==='dark'));store.set('sd-theme',th);}
setTheme(store.get('sd-theme')==='light'?'light':'dark');
$('#themeSwitch').addEventListener('click',()=>setTheme(root.dataset.theme==='dark'?'light':'dark'));
$('#langSwitch').addEventListener('click',()=>{lang=lang==='th'?'en':'th';store.set('sd-lang',lang);applyLang();});
document.querySelectorAll('[data-home]').forEach(a=>a.href=LANDING_URL);
function applyLang(){
 root.lang=lang;document.title=t('title');
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
 document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
 document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
 const ls=$('#langSwitch');ls.setAttribute('aria-checked',String(lang==='en'));ls.setAttribute('aria-label',lang==='en'?'Switch language to Thai':'เปลี่ยนภาษาเป็นอังกฤษ');
 renderExamples();renderSelects();rerenderChat();
}

/* ---------- tabs ---------- */
const tabs=[...document.querySelectorAll('[role=tab]')],panels=[$('#panel-check'),$('#panel-submit')];
function setTab(i,focus){
 $('#tabs').dataset.active=i;$('#track').dataset.active=i;
 tabs.forEach((b,j)=>{b.setAttribute('aria-selected',String(i===j));b.tabIndex=i===j?0:-1;});
 panels.forEach((p,j)=>p.inert=i!==j);
 if(focus)tabs[i].focus();
 history.replaceState(null,'',i?'#submit':'#check');
}
tabs.forEach((b,i)=>{b.addEventListener('click',()=>setTab(i));b.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();setTab(i?0:1,true);}});});
setTab(location.hash==='#submit'?1:0);

/* ---------- chat ---------- */
const msgs=$('#messages'),input=$('#checkInput'),btn=$('#checkBtn');
let history_=[],busy=false;
function autosize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,200)+'px';}
input.addEventListener('input',()=>{autosize(input);btn.disabled=busy||!input.value.trim();});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#checkForm').requestSubmit();}});
function renderExamples(){
 const box=$('#examples');box.querySelectorAll('button').forEach(b=>b.remove());
 EXAMPLES.forEach(ex=>{const b=document.createElement('button');b.type='button';b.textContent=ex[lang];b.title=ex[lang];
  b.addEventListener('click',()=>{input.value=ex[lang];autosize(input);btn.disabled=busy;input.focus();});box.append(b);});
}
function bubbleHTML(m){
 if(m.role==='user')return `<div class="msg user"><div class="bubble"><span class="tag">${t('you')}</span>${esc(m.text)}</div></div>`;
 if(m.role==='typing')return `<div class="msg bot">${botAvatar}<div class="bubble" aria-label="…"><span class="typing"><i></i><i></i><i></i></span></div></div>`;
 if(m.role==='welcome')return `<div class="msg bot">${botAvatar}<div class="bubble">${t('check.welcome')}</div></div>`;
 const r=m.result;
 if(r.kind==='demo'||r.kind==='error')return `<div class="msg bot">${botAvatar}<div class="bubble result"><span class="verdict info">${icon.info}${r.kind==='demo'?t('res.demoT'):'!'}</span><p class="note">${r.kind==='demo'?t('res.demo'):t('res.err')}</p></div></div>`;
 const bad=r.group==='negative';
 return `<div class="msg bot">${botAvatar}<div class="bubble result"><span class="verdict ${bad?'bad':'good'}">${bad?icon.bad:icon.ok}${bad?t('res.bad'):t('res.good')}</span>
  <dl><dt>${t('res.group')}</dt><dd>${esc(groupLabel(r.group))}</dd>${r.sub?`<dt>${t('res.sub')}</dt><dd>${esc(subLabel(r.sub))}</dd>`:''}${r.confidence!=null?`<dt>${t('res.conf')}</dt><dd>${Math.round(r.confidence*100)}%</dd>`:''}</dl>
  <p class="note">${bad?t('res.noteBad'):t('res.noteGood')}</p></div></div>`;
}
function rerenderChat(){msgs.innerHTML=[{role:'welcome'},...history_].map(bubbleHTML).join('');msgs.scrollTop=msgs.scrollHeight;}
function pushMsg(m){history_.push(m);msgs.insertAdjacentHTML('beforeend',bubbleHTML(m));msgs.scrollTop=msgs.scrollHeight;}

/* แปลงผลจาก API ให้อยู่ในรูป {group:'positive'|'negative', sub, confidence} — ปรับตามรูปแบบที่ api/ ส่งกลับจริง */
function normalize(j){
 const g=j.group??j.label??j.prediction??j.class;
 const group=(g===1||g==='1'||/neg|scam|spam|fraud|น่าสงสัย/i.test(String(g)))?'negative':'positive';
 return {kind:'ok',group,sub:j.sub_group??j.subgroup??j.category??null,confidence:j.group_confidence??j.confidence??j.probability??j.score??null};
}
async function checkMessage(text){
 if(!API_BASE){
  await new Promise(r=>setTimeout(r,1400));
  const ex=EXAMPLES.find(e=>e.th===text||e.en===text);
  return ex?{kind:'ok',group:ex.g,sub:ex.s,confidence:null}:{kind:'demo'};
 }
 try{const res=await fetch(API_BASE+ENDPOINT.check,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  if(!res.ok)throw new Error(res.status);return normalize(await res.json());}catch(e){return {kind:'error'};}
}
$('#checkForm').addEventListener('submit',async e=>{
 e.preventDefault();const text=input.value.trim();if(!text||busy)return;
 busy=true;btn.disabled=true;input.value='';autosize(input);
 pushMsg({role:'user',text});
 msgs.insertAdjacentHTML('beforeend',bubbleHTML({role:'typing'}));const typingEl=msgs.lastElementChild;msgs.scrollTop=msgs.scrollHeight;
 const result=await checkMessage(text);
 typingEl.remove();pushMsg({role:'bot',result});
 busy=false;btn.disabled=!input.value.trim();input.focus();
});

/* ---------- submit form ---------- */
const sText=$('#subText'),sGroup=$('#subGroup'),sSub=$('#subSub'),sBtn=$('#subBtn'),sStatus=$('#subStatus');
function renderSelects(){
 const gv=sGroup.value,sv=sSub.value;
 sGroup.innerHTML=`<option value="">${t('sub.choose')}</option>`+GROUPS.map(g=>`<option value="${g.value}">${g[lang]}</option>`).join('');
 sGroup.value=gv;fillSubs();sSub.value=sv;validate();
}
function fillSubs(){const g=GROUPS.find(g=>g.value===sGroup.value);
 sSub.innerHTML=`<option value="">${t('sub.choose')}</option>`+(g?g.subs.map(s=>`<option value="${s.value}">${s[lang]}</option>`).join(''):'');sSub.disabled=!g;}
function validate(){sBtn.disabled=!(sText.value.trim()&&sGroup.value&&sSub.value);}
sGroup.addEventListener('change',()=>{fillSubs();validate();});sSub.addEventListener('change',validate);sText.addEventListener('input',validate);
$('#subForm').addEventListener('submit',async e=>{
 e.preventDefault();if(sBtn.disabled)return;
 const label=sBtn.innerHTML;sBtn.disabled=true;sBtn.innerHTML=`<span class="spin"></span>${t('sub.btn')}`;sStatus.innerHTML='';
 let state='ok';
 if(!API_BASE){await new Promise(r=>setTimeout(r,900));state='demo';}
 else{try{const res=await fetch(API_BASE+ENDPOINT.submit,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:sText.value.trim(),group:sGroup.value,sub_group:sSub.value})});if(!res.ok)throw 0;}catch(_){state='err';}}
 sBtn.innerHTML=label;
 sStatus.innerHTML=`<div class="toast ${state==='err'?'err':'ok'}">${state==='err'?icon.bad:state==='demo'?icon.info:icon.ok}<span>${t(state==='ok'?'sub.ok':state==='demo'?'sub.demo':'sub.err')}</span></div>`;
 if(state!=='err'){sText.value='';sGroup.value='';fillSubs();}
 validate();
});

applyLang();
</script>
</body></html>
